[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jy-auto-editor"
version = "0.1.0"
description = "剪映 AI 全自动剪辑插件 - 基于混合驱动的智能视频编辑系统"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "AI Video Editor Team" },
]
keywords = ["video-editing", "jianying", "capcut", "ai", "automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
]

dependencies = [
    # 核心
    "pydantic>=2.0,<3.0",
    "pyyaml>=6.0",
    "typer>=0.9.0",
    "rich>=13.0",

    # 异步 & 网络
    "httpx>=0.25.0",
    "websockets>=12.0",

    # 剪映草稿处理
    "pycryptodome>=3.19.0",

    # AI 服务
    "openai>=1.10.0",
    "dashscope>=1.14.0",

    # 音视频处理
    "scenedetect>=0.6.2",
    "faster-whisper>=0.10.0",

    # GUI 自动化 (Windows)
    "uiautomation>=2.0.18",

    # 工具
    "python-dotenv>=1.0.0",
    "aiofiles>=23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.1.0",
    "mypy>=1.7",
    "pre-commit>=3.5",
]
gpu = [
    "onnxruntime-gpu>=1.16",
]
monitor = [
    "psutil>=5.9",
    "pynvml>=11.5",
]
web = [
    "fastapi>=0.109.0",
    "uvicorn>=0.25.0",
]
all = [
    "jy-auto-editor[dev,gpu,monitor,web]",
]

[project.scripts]
jy-edit = "jy_auto_editor.ui.cli.main:main"

[project.urls]
Homepage = "https://github.com/your-org/jy-auto-editor"
Documentation = "https://jy-auto-editor.readthedocs.io"
Repository = "https://github.com/your-org/jy-auto-editor"
Issues = "https://github.com/your-org/jy-auto-editor/issues"

[tool.hatch.build.targets.wheel]
packages = ["jy_auto_editor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow",
    "integration: marks integration tests",
    "gui: marks GUI automation tests",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["jy_auto_editor", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
