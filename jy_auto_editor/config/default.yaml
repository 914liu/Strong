# ══════════════════════════════════════════════════════════
# 剪映 AI 自动剪辑 — 配置文件
# ══════════════════════════════════════════════════════════
# 环境变量引用语法: ${ENV_VAR}
# 复制此文件为 config.yaml 并填入实际值

# ── 全局 ──────────────────────────────────────────────
debug: false
log_level: INFO                     # DEBUG / INFO / WARNING / ERROR
temp_dir: ""                        # 临时文件目录（空=系统默认）
cache_dir: ""                       # 缓存目录（空=系统默认）

# ── AI Provider 配置 ──────────────────────────────────
providers:
  llm:
    default: doubao                 # 默认 LLM: doubao / openai / ollama / qwen
    fallback: openai                # 备用 LLM（默认不可用时自动降级）

    doubao:
      api_key: ${DOUBAO_API_KEY}
      model: doubao-pro-32k         # doubao-pro-32k / doubao-lite-32k / doubao-pro-128k
      max_tokens: 4096
      timeout: 60

    openai:
      api_key: ${OPENAI_API_KEY}
      base_url: ""                  # 留空使用官方地址，或填中转地址
      model: gpt-4o
      max_tokens: 4096
      timeout: 60
      retry: 3

    ollama:
      base_url: http://localhost:11434
      model: qwen2.5:14b
      timeout: 120

    qwen:
      api_key: ${DASHSCOPE_API_KEY}
      model: qwen-max
      max_tokens: 4096
      timeout: 60

  asr:
    default: openai-whisper         # openai-whisper / whisper-local

    openai-whisper:
      api_key: ${OPENAI_API_KEY}
      base_url: ""
      language: zh

    whisper-local:
      model: large-v3               # tiny/base/small/medium/large-v3
      device: cuda                  # cuda / cpu
      compute_type: float16         # float16 / int8 / float32
      language: zh

# ── 驱动层配置 ────────────────────────────────────────
driver:
  use_gui_export: true              # 是否通过 GUI 自动化触发导出
  gui_timeout: 300                  # GUI 操作超时秒数
  auto_decrypt: true                # 自动处理加密草稿
  # jianying_path: ""               # 剪映安装路径（留空自动检测）
  # draft_root: ""                  # 草稿根目录（留空自动检测）
